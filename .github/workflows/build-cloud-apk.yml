name: Build Shooters Hill Cloud APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select and extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SOURCE_ZIPS < <(find . -maxdepth 1 -type f -iname '*Android*.zip' -print | sort)

          if [ "${#SOURCE_ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: Android source ZIP not found in repository root."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          if [ "${#SOURCE_ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one Android source ZIP was found. Keep only the current build ZIP."
            printf ' - %s\n' "${SOURCE_ZIPS[@]}"
            exit 1
          fi

          SOURCE_ZIP="${SOURCE_ZIPS[0]}"
          echo "Using source ZIP: $SOURCE_ZIP"

          mkdir -p extracted
          unzip -q "$SOURCE_ZIP" -d extracted

          SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android settings.gradle not found after extraction."
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Show tool versions
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --version

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace --info

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: Expected APK was not produced: $APK"
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi
          cp "$APK" Shooters-Hill-Team-Tracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Shooters-Hill-Team-Tracker-APK
          path: Shooters-Hill-Team-Tracker.apk
          if-no-files-found: error
