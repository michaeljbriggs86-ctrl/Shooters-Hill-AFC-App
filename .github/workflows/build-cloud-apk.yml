name: Build Shooters Hill Cloud APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source ZIP
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="$(find . -maxdepth 1 -type f -iname '*Android*.zip' -print -quit)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "Android source ZIP not found"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Using: $SOURCE_ZIP"

          mkdir -p extracted
          unzip -q "$SOURCE_ZIP" -d extracted

          SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "Android settings.gradle not found after extraction"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
          Shooters-Hill-Team-Tracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shooters-Hill-Team-Tracker-APK
          path: Shooters-Hill-Team-Tracker.apk
