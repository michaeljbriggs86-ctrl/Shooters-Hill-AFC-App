name: Build Shooters Hill Cloud APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q Shooters_Hill_Team_Tracker_Android_Cloud_v2_CONNECTED.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: valiants_android_v200
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: |
          cp valiants_android_v200/app/build/outputs/apk/debug/app-debug.apk \
          Shooters-Hill-Team-Tracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shooters-Hill-Team-Tracker-APK
          path: Shooters-Hill-Team-Tracker.apk
